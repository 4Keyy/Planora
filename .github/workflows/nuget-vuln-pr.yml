name: NuGet Vulnerability Tracking

# Dependabot cannot scope NuGet updates to the central Directory.Packages.props.
# Keep one issue across clean scans and regressions; Actions cannot open PRs here.
# The former security/nuget-vuln-tracking branch is preserved and no longer written.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nuget-vulnerability-tracking
  cancel-in-progress: false

jobs:
  scan-and-track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Test report and issue lifecycle
        run: node --test .github/scripts/nuget-vulnerability-report.test.mjs

      # This reporting job must restore the vulnerable graph to inspect it.
      # Normal CI builds retain the repository's NuGet audit gate.
      - name: Restore solution for vulnerability reporting
        run: dotnet restore Planora.sln -p:NuGetAudit=false

      - name: Scan for vulnerable packages
        shell: bash
        run: dotnet list Planora.sln package --vulnerable --include-transitive --format json --output-version 1 --no-restore > nuget-vulnerabilities.json

      # A failed command or malformed/feed-error report stops before any issue mutation.
      - name: Create, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/nuget-vulnerability-report.mjs nuget-vulnerabilities.json

      - name: Preserve the machine-readable report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-vulnerability-report
          path: nuget-vulnerabilities.json
          if-no-files-found: ignore
