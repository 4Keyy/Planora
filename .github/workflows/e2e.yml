name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'BuildingBlocks/**'
      - 'GrpcContracts/**'
      - 'Planora.ApiGateway/**'
      - 'Services/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'postgres/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/e2e.yml'
      - 'BuildingBlocks/**'
      - 'GrpcContracts/**'
      - 'Planora.ApiGateway/**'
      - 'Services/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'postgres/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-todos-sharing-hidden:
    name: e2e (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # One worker runs the whole suite for well over two hours. Each shard starts its own stack
    # (about 6 minutes with the build) and runs whole spec files; Playwright balances shards by
    # test count, not duration, so the live motion matrices still make some shards take over 40
    # minutes — with four shards and 45 minutes two were cut off before their summaries.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      COMPOSE_PROJECT_NAME: planora-e2e-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create e2e environment
        shell: bash
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "RABBITMQ_USER=planora_e2e"
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 64)"
            echo "GRPC_SERVICE_KEY=$(openssl rand -hex 32)"
            echo "E2E_SMTP_PASSWORD=$(openssl rand -hex 32)"
            echo "NEXT_PUBLIC_API_URL=http://127.0.0.1:5132"
            echo "Retention__Enabled=false"
            echo "Retention__RunOnStartup=false"
          } > .env.e2e

      - name: Start Docker stack
        run: docker compose --env-file .env.e2e -f docker-compose.yml -f frontend/e2e/docker-compose.http.yml up -d --build

      - name: Wait for gateway health checks
        shell: bash
        run: |
          endpoints=(
            "http://127.0.0.1:5132/health"
            "http://127.0.0.1:5132/auth/health"
            "http://127.0.0.1:5132/categories/health"
            "http://127.0.0.1:5132/todos/health"
            "http://127.0.0.1:5132/messaging/health"
            "http://127.0.0.1:5132/realtime/health"
            "http://127.0.0.1:8025/livez"
          )

          for endpoint in "${endpoints[@]}"; do
            echo "Waiting for ${endpoint}"
            for attempt in {1..90}; do
              if curl --fail --silent --show-error "${endpoint}" > /dev/null; then
                break
              fi

              if [ "${attempt}" -eq 90 ]; then
                echo '::error::Gateway health prerequisite did not become ready; redacted startup diagnostics follow'
                exit 1
              fi

              sleep 2
            done
          done

      - name: Capture failed stack startup diagnostics
        if: ${{ failure() }}
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const output = join(process.env.RUNNER_TEMP, 'planora-e2e-startup-diagnostics');
          mkdirSync(output, { recursive: true });
          let environment;
          try {
            environment = new Map(readFileSync('.env.e2e', 'utf8').split(/\r?\n/)
              .filter(line => /^[A-Z][A-Z0-9_]*=/.test(line))
              .map(line => [line.slice(0, line.indexOf('=')), line.slice(line.indexOf('=') + 1)]));
          } catch {
            environment = new Map();
          }
          const required = ['POSTGRES_PASSWORD', 'REDIS_PASSWORD', 'RABBITMQ_PASSWORD',
            'JWT_SECRET', 'GRPC_SERVICE_KEY', 'E2E_SMTP_PASSWORD'];
          if (required.some(key => !environment.get(key))) {
            writeFileSync(join(output, 'unavailable.txt'),
              'Startup diagnostics were withheld because the disposable secret-redaction inputs are incomplete.\n');
            console.log('Startup diagnostics withheld: incomplete disposable redaction inputs');
          } else {
            const values = [...environment].filter(([key, value]) => value && (required.includes(key) || value.length >= 8))
              .map(([, value]) => value)
              .sort((a, b) => b.length - a.length);
            const redact = text => values.reduce((safe, value) => safe.split(value).join('[redacted]'), text);
            const compose = ['compose', '--env-file', '.env.e2e', '-f', 'docker-compose.yml',
              '-f', 'frontend/e2e/docker-compose.http.yml'];
            const invoke = args => spawnSync('docker', args, {
              encoding: 'utf8', timeout: 15_000, maxBuffer: 8 * 1024 * 1024,
            });
            const capture = args => {
              const result = invoke(args);
              return redact(`exit=${result.status}\n${result.stdout ?? ''}${result.stderr ?? ''}${result.error?.message ?? ''}`);
            };
            writeFileSync(join(output, 'compose-state.txt'), capture([...compose, 'ps', '--all', '--format', 'json']));
            const ids = (invoke([...compose, 'ps', '--all', '--quiet']).stdout ?? '').split(/\s+/)
              .filter(id => /^[a-f0-9]{12,64}$/.test(id));
            writeFileSync(join(output, 'container-state.txt'), ids.map(id =>
              capture(['inspect', '--format', '{{.Name}} restartCount={{.RestartCount}} {{json .State}}', id])).join('\n'));
            writeFileSync(join(output, 'startup-logs.txt'),
              capture([...compose, 'logs', '--no-color', '--tail=200']));
            console.log('Saved redacted Compose state, container health/restarts and startup logs');
          }
          NODE

      - name: Upload redacted stack startup diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-startup-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/planora-e2e-startup-diagnostics
          if-no-files-found: ignore
          retention-days: 3

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Install Chromium explicitly; setup-node caches npm, not browser binaries.
      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # T2.6 — build + start the Next.js frontend so the `ui` project can
      # drive a real browser against it. The dev server is intentionally not
      # used: dev mode has different hydration timing and Webpack overlays
      # that interfere with Playwright.
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5132

      - name: Start frontend (background) and wait for readiness
        shell: bash
        working-directory: frontend
        run: |
          NEXT_PUBLIC_API_URL=http://127.0.0.1:5132 \
            nohup npm run start -- -p 3000 > ../frontend-server.log 2>&1 &
          echo $! > ../frontend.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000" > /dev/null; then
              echo "Frontend ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start; tailing log:"
          tail -200 ../frontend-server.log
          exit 1

      - name: Run Playwright e2e (api + ui projects)
        run: node e2e/run-ci.cjs --shard=${{ matrix.shard }}/6
        working-directory: frontend
        env:
          E2E_API_URL: http://127.0.0.1:5132
          E2E_FRONTEND_URL: http://127.0.0.1:3000
          E2E_MAILPIT_URL: http://127.0.0.1:8025
          E2E_DISPOSABLE_PROJECT: planora-e2e-ci
          E2E_DISPOSABLE_TODO_CONTAINER: planora-todo-api
          # The runner context exists only inside steps, so the report path is set per step:
          # at job level it made GitHub reject the whole workflow file.
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/planora-playwright-results.json

      - name: Summarize Playwright skips and retries
        if: always()
        run: node e2e/_report-summary.cjs
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/planora-playwright-results.json

      - name: Stop frontend
        if: always()
        shell: bash
        run: |
          if [ -f frontend.pid ]; then
            pid=$(cat frontend.pid)
            kill "$pid" 2>/dev/null || true
          fi

      # Secret-bearing HTML steps/traces are not published. Only UI failure images.
      - name: Upload Playwright failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-screenshots-${{ matrix.shard }}
          path: frontend/test-results/playwright/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Stop Docker stack
        if: always()
        shell: bash
        run: |
          trap 'rm -f .env.e2e' EXIT
          docker compose --env-file .env.e2e -f docker-compose.yml -f frontend/e2e/docker-compose.http.yml down --remove-orphans
