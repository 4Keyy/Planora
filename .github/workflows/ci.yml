name: CI
on:
  push:
    branches: [main, develop, 'audit/**', 'fix/**']
  pull_request:
    branches: [main, develop]

# Minimum permissions. Each job only receives what it needs.
permissions:
  contents: read

# Cancel in-progress runs for the same branch to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/docs/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/docs
      - run: npm test
        working-directory: tools/docs
      - run: npm audit --audit-level=high
        working-directory: tools/docs
      - name: Check all Git-listed documentation
        run: npm run check
        working-directory: tools/docs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real PostgreSQL for the retention suites (tests/Planora.UnitTests/BuildingBlocks/Retention/Postgres):
    # ExecuteDelete, ExecuteUpdate and the advisory lock are PostgreSQL-only, so the policies that delete
    # data are run live here. Every test creates and drops its own database on this server. The active
    # list's ordering suite (TodoActiveListPostgresTests) runs here too, its sessions in Pacific/Honolulu.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANORA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
          # CPM: hash every input that can change the restore graph (csproj graph
          # + central package versions + build props). No packages.lock.json yet,
          # so the action hashes these files to derive the cache key.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Prepare disposable RabbitMQ provider fixture
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const password = randomBytes(32).toString('hex');
          const fixture = join(process.env.RUNNER_TEMP, 'planora-rabbit.json');
          writeFileSync(fixture, JSON.stringify({ HostName: '127.0.0.1', Port: 5672,
            UserName: 'planora_ci', Password: password }), { mode: 0o600 });
          writeFileSync(join(process.env.RUNNER_TEMP, 'planora-rabbit.env'),
            `RABBITMQ_DEFAULT_USER=planora_ci\nRABBITMQ_DEFAULT_PASS=${password}\n`, { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `PLANORA_TEST_RABBIT_FIXTURE=${fixture}\n`);
          NODE
          cat > "$RUNNER_TEMP/planora-rabbit-diagnostics.mjs" <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'planora-rabbit-diagnostics');
          mkdirSync(directory, { recursive: true });
          let fixture;
          try { fixture = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'planora-rabbit.json'), 'utf8')); }
          catch { fixture = null; }
          if (!fixture?.Password || !fixture?.UserName) {
            writeFileSync(join(directory, 'unavailable.txt'), 'Broker diagnostics withheld: incomplete disposable redaction inputs.\n');
          } else {
            const redact = text => [fixture.Password, fixture.UserName].reduce((safe, value) => safe.split(value).join('[redacted]'), text);
            const container = process.argv[2] ?? 'planora-ci-rabbit';
            const invoke = args => spawnSync('docker', args, {
              encoding: 'utf8', timeout: 10_000, maxBuffer: 4 * 1024 * 1024,
            });
            const owner = invoke(['inspect', '--format', '{{index .Config.Labels "com.planora.ci"}}', container]);
            if (!process.env.GITHUB_RUN_ID || owner.status !== 0 || owner.stdout.trim() !== process.env.GITHUB_RUN_ID) {
              writeFileSync(join(directory, 'unavailable.txt'), 'Broker diagnostics withheld: disposable container ownership did not match.\n');
            } else {
              const capture = args => {
                const result = invoke(args);
                return redact(`exit=${result.status}\n${result.stdout ?? ''}${result.stderr ?? ''}${result.error?.message ?? ''}`);
              };
              writeFileSync(join(directory, 'state.txt'), capture(['inspect', '--format',
                '{{.Name}} restartCount={{.RestartCount}} {{json .State}}', container]));
              writeFileSync(join(directory, 'startup-logs.txt'), capture(['logs', '--tail', '200', container]));
              writeFileSync(join(directory, 'readiness.txt'), capture(['exec', '--user', 'rabbitmq', container,
                'rabbitmq-diagnostics', '-q', 'check_running']) + '\n' + capture(['exec', '--user', 'rabbitmq', container,
                'rabbitmq-diagnostics', '-q', 'check_port_listener', '5672']));
              console.log('Saved redacted disposable RabbitMQ state, startup logs and readiness command exits');
            }
          }
          NODE
          docker run -d --name planora-ci-rabbit \
            --label com.planora.ci="$GITHUB_RUN_ID" \
            --env-file "$RUNNER_TEMP/planora-rabbit.env" \
            --mount type=volume,source=planora-ci-rabbit-data,target=/var/lib/rabbitmq \
            -p 127.0.0.1:5672:5672 rabbitmq:3.13-management-alpine
          # Root probes can create an unreadable Erlang cookie while the server bootstraps its data directory.
          for attempt in {1..60}; do
            if docker exec --user rabbitmq planora-ci-rabbit rabbitmq-diagnostics -q check_running > /dev/null 2>&1 \
              && docker exec --user rabbitmq planora-ci-rabbit rabbitmq-diagnostics -q check_port_listener 5672 > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Disposable RabbitMQ fixture did not become ready'
          node "$RUNNER_TEMP/planora-rabbit-diagnostics.mjs"
          exit 1
      - run: dotnet restore Planora.sln
      - run: dotnet build Planora.sln --no-restore --configuration Release -warnaserror
      - run: dotnet test Planora.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./coverage/backend
      - name: Seed durable quarantine before broker restart
        env:
          PLANORA_TEST_RABBIT_RESTART_PHASE: seed
        run: dotnet test tests/Planora.UnitTests/Planora.UnitTests.csproj --no-build --configuration Release --filter FullyQualifiedName~RestartSeed_LeavesConfirmedPoisonInQuarantine --logger trx --results-directory ./coverage/backend/restart-seed
      - name: Restart the disposable broker
        shell: bash
        run: |
          docker restart planora-ci-rabbit
          for attempt in {1..60}; do
            if docker exec --user rabbitmq planora-ci-rabbit rabbitmq-diagnostics -q check_running > /dev/null 2>&1 \
              && docker exec --user rabbitmq planora-ci-rabbit rabbitmq-diagnostics -q check_port_listener 5672 > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Disposable RabbitMQ fixture did not recover after restart'
          node "$RUNNER_TEMP/planora-rabbit-diagnostics.mjs"
          exit 1
      - name: Verify durable quarantine after broker restart
        env:
          PLANORA_TEST_RABBIT_RESTART_PHASE: verify
        run: dotnet test tests/Planora.UnitTests/Planora.UnitTests.csproj --no-build --configuration Release --filter FullyQualifiedName~RestartVerify_QuarantineRetainsOriginalPersistentMessage --logger trx --results-directory ./coverage/backend/restart-verify
      - name: Upload redacted broker readiness diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rabbitmq-readiness-diagnostics
          path: ${{ runner.temp }}/planora-rabbit-diagnostics
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: ./coverage/backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle budget (advisory)
        continue-on-error: true
        run: |
          node --test e2e/bundle-report.test.mjs
          npm run bundle:report -- --budget bundle-budget.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-report
          path: frontend/coverage
