name: CI
on:
  push:
    branches: [main, develop, 'audit/**', 'fix/**']
  pull_request:
    branches: [main, develop]

# Minimum permissions. Each job only receives what it needs.
permissions:
  contents: read

# Cancel in-progress runs for the same branch to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md TESTING.md ARCHITECTURE.md 'docs/**/*.md'
          fail: true

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real PostgreSQL for the retention suites (tests/Planora.UnitTests/BuildingBlocks/Retention/Postgres):
    # ExecuteDelete, ExecuteUpdate and the advisory lock are PostgreSQL-only, so the policies that delete
    # data are run live here. Every test creates and drops its own database on this server. The active
    # list's ordering suite (TodoActiveListPostgresTests) runs here too, its sessions in Pacific/Honolulu.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLANORA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          # CPM: hash every input that can change the restore graph (csproj graph
          # + central package versions + build props). No packages.lock.json yet,
          # so the action hashes these files to derive the cache key.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            Directory.Build.props
      - run: dotnet restore Planora.sln
      - run: dotnet build Planora.sln --no-restore --configuration Release -warnaserror
      - run: dotnet test Planora.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./coverage/backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: ./coverage/backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle budget (advisory)
        continue-on-error: true
        run: |
          node --test e2e/bundle-report.test.mjs
          npm run bundle:report -- --budget bundle-budget.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-report
          path: frontend/coverage
